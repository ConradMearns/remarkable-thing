[project]
name = "rmsync"
version = "0.1.0"
description = "Two-way sync between laptop documents (markdown / Typst) and a rooted reMarkable 2"
requires-python = ">=3.12"
dependencies = [
    "rmscene==0.6.1",
    "rmc==0.3.0",
    "svgelements>=1.9",
    "cairosvg>=2.7",
    "pypdf>=4.0",
]

[project.scripts]
rmsync = "rmsync.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["rmsync"]
